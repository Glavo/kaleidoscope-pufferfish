name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cookery: ['1.5.1-neoforge+mc1.21.1', '1.6.0-neoforge+mc1.21.1']
        create: ['true', 'false']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -Pkaleidoscope_cookery_version=${{ matrix.cookery }} -Pinclude_create=${{ matrix.create }}

      - name: Run game tests
        run: ./gradlew runGameTestServer -Pkaleidoscope_cookery_version=${{ matrix.cookery }} -Pinclude_create=${{ matrix.create }}

      # Upload once, using the oldest supported Cookery version for the dependency metadata.
      - name: Upload mod JAR
        if: matrix.cookery == '1.5.1-neoforge+mc1.21.1' && matrix.create == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/*.jar
          if-no-files-found: error
          archive: false
